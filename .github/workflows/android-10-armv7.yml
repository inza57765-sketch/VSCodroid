name: Android 10 ARMv7

on:
  push:
    branches:
      - android-10-armv7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager             "platform-tools"             "platforms;android-37"             "build-tools;37.0.0"             "ndk;27.2.12479018"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Show Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Build ARMv7 APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSCodroid-Android10-ARMv7
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
