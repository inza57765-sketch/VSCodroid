name: Android 10 ARMv7

on:
  push:
    branches:
      - android-10-armv7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          which sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Show available Android packages
        run: |
          sdkmanager --list | grep -E "platforms;android-[0-9]+|build-tools;[0-9]" | head -40

      - name: Install Android SDK
        run: |
          sdkmanager             "platform-tools"             "build-tools;35.0.0"             "ndk;27.2.12479018"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Show Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Build ARMv7 APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSCodroid-Android10-ARMv7
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
